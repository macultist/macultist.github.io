<style>
:root{color-scheme:dark;--bg:#0b1220;--surface:#111a2c;--ink:#e5ecf6;--muted:#93a1bb;--line:#22304a;--accent:#22d3a5;--pet:#f6a04d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.5;word-break:keep-all}

.t{font-size:19px;font-weight:700}.d{color:var(--muted);font-size:14px;margin-top:2px}
.go{color:var(--muted);font-size:20px}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media(max-width:480px){a.site{grid-template-columns:44px 1fr}.go{display:none}.ic{width:44px;height:44px;font-size:22px}}
